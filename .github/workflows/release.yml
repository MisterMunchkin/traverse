name: Experimental release archive

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: '1'
      NO_COLOR: '1'
      EXPO_NO_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release identity
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if(p.name!=="@mistermunchkin/traverse" || process.env.RELEASE_TAG!=="v"+p.version) throw Error("Release tag must match package identity/version");'
      - name: Install locked contributor dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/expo --ignore-scripts --no-audit --no-fund
      - name: Run full contributor gate
        run: npm run check -- --out .checks/release-check
      - name: Pack exact tagged release
        run: npm run release:pack -- --out .checks/release-bundle --tag "$RELEASE_TAG"
      - name: Test the exact release archive as a dev dependency
        run: |
          ARCHIVE=$(node -p 'JSON.parse(require("fs").readFileSync(".checks/release-bundle/release.json")).filename')
          npm run check:package -- --out .checks/release-archive-check --archive ".checks/release-bundle/$ARCHIVE"
          npm run release:verify -- --out .checks/release-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traverse-release-bundle
          path: .checks/release-bundle/
          if-no-files-found: error
          retention-days: 7

  attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: traverse-release-bundle
          path: bundle
      - name: Attach verified assets without replacing existing downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" bundle/* --repo "$GITHUB_REPOSITORY"
